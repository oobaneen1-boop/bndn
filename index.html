<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بندن</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
:root{--cream:#fff8ee;--gold:#f3d7a4;--rose:#ffd0c8;--soft:#f1dcd2;color-scheme:dark;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--cream);font-family:'Noto Naskh Arabic','Amiri',serif;font-size:19px;line-height:1.9;background:#3a1823}
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;z-index:-2}
.shade{position:fixed;inset:0;z-index:-1;background:linear-gradient(to bottom,rgba(58,24,35,.10) 0%,rgba(58,24,35,.22) 45%,rgba(58,24,35,.62) 100%)}
.wrap{max-width:480px;margin:0 auto;padding:0 20px;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(36px + env(safe-area-inset-bottom,0px))}
.top{height:50vh;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;padding-bottom:26px}
.top h1{margin:0;font-family:'Amiri',serif;font-weight:700;font-size:64px;line-height:1.2;letter-spacing:3px;text-shadow:0 3px 18px rgba(40,10,20,.55)}
.top p{margin:4px 0 0;color:var(--gold);font-size:18px;text-shadow:0 2px 10px rgba(40,10,20,.6)}
a.b{display:block;text-decoration:none;color:var(--cream);margin:16px 0;padding:15px 20px 13px;border-radius:20px;text-align:center;
background:linear-gradient(145deg,rgba(255,255,255,.30),rgba(255,255,255,.07));
border:1px solid rgba(255,255,255,.42);
-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
box-shadow:0 14px 28px rgba(30,5,15,.38),0 3px 0 rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.65),inset 0 -3px 8px rgba(40,10,20,.22);
transition:transform .15s,box-shadow .15s;text-shadow:0 1px 6px rgba(40,10,20,.35)}
a.b:active{transform:translateY(3px);box-shadow:0 6px 14px rgba(30,5,15,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.b .t{display:block;font-family:'Amiri',serif;font-weight:700;font-size:23px;line-height:1.5}
.b .s{display:block;font-size:15px;color:var(--soft);line-height:1.7}
.b .s i{font-style:normal;color:var(--rose);font-weight:600}
a.cta{background:linear-gradient(145deg,rgba(255,226,170,.38),rgba(255,226,170,.10));border-color:rgba(255,230,180,.7)}
a.cta .t{color:#fff0cf}
.foot{text-align:center;color:var(--soft);font-size:14px;letter-spacing:1px;padding-top:18px;text-shadow:0 1px 6px rgba(40,10,20,.5)}
</style></head><body>
